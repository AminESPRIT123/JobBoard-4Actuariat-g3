spring.application.name=gateway
server.port=8086

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Routes Statiques
spring.cloud.gateway.server.webmvc.routes[0].id=candidature
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8094
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/mic3/candidature/**

spring.cloud.gateway.server.webmvc.routes[1].id=candidat
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8792
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/mic1/candidates/**

spring.cloud.gateway.server.webmvc.routes[2].id=job
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8793
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/jobs/**,/api/categories/**

spring.cloud.gateway.server.webmvc.routes[3].id=meeting
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8095
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/meetings/**

spring.cloud.gateway.server.webmvc.routes[4].id=notification
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**

