
spring.application.name=GATEWAY
server.port=8099

# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Route dynamique Candidature
spring.cloud.gateway.server.webmvc.routes[0].id=candidature
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CANDITATURE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/mic3/candidature/**

# Route dynamique Candidat
spring.cloud.gateway.server.webmvc.routes[1].id=candidat
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CANDIDAT
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/mic1/candidates/**

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG


# Microservice JOB
spring.cloud.gateway.server.webmvc.routes[2].id=job
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://JOB
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/jobs/**




# Microservice MEETING
spring.cloud.gateway.server.webmvc.routes[3].id=meeting
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://MEETING
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/meetings/**
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted




# Microservice NOTIFICATION
spring.cloud.gateway.server.webmvc.routes[4].id=notification
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://NOTIFICATION
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**