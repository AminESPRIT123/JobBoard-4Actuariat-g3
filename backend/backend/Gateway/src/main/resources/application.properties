spring.application.name=Gateway
server.port=8086

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---------------------------------------------------------------
# Choix de la configuration des routes (un seul profil a la fois) :
#   static        -> routes statiques dans application-static.properties
#   static-java   -> routes statiques dans GatewayApplication (bean Java)
#   dynamic       -> routes dynamiques (Eureka, lb://) dans application-dynamic.properties
#   dynamic-java  -> routes dynamiques (Eureka, lb://) dans GatewayApplication (bean Java)
# Pour changer : modifier la ligne ci-dessous, ou remplir "Active profiles"
# dans Run > Edit Configurations > GatewayApplication.
# ---------------------------------------------------------------
spring.profiles.active=dynamic

# Partie 3.2.a : logs de routage (on voit l'instance choisie a chaque requete)
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.web.client=DEBUG
