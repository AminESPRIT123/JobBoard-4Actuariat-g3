
# MS candidat (candidates + addresses) -> algorithme Random (voir CandidatLoadBalancerConfig)
spring.cloud.gateway.server.webmvc.routes[0].id=candidat
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://candidat
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/mic1/**

# MS job (jobs + categories) -> Round Robin (par defaut)
spring.cloud.gateway.server.webmvc.routes[1].id=job
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://job
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/jobs/**,/api/categories/**

# MS candidature -> Round Robin (par defaut)
spring.cloud.gateway.server.webmvc.routes[2].id=candidature
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://candidature
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/mic3/**


# MS meeting (Node.js) -> Round Robin (par defaut)
